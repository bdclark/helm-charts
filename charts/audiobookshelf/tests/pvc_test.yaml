suite: test pvc
templates:
  - pvc.yaml
tests:
  - it: should create both PVCs with default values
    asserts:
      - hasDocuments:
          count: 2

  - it: should create config PVC with default values
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-audiobookshelf-config
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi

  - it: should create metadata PVC with default values
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-audiobookshelf-metadata
      - equal:
          path: spec.resources.requests.storage
          value: 5Gi

  - it: should not create config PVC when using existing claim
    set:
      persistence.config.existingClaim: my-config
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-audiobookshelf-metadata

  - it: should not create metadata PVC when disabled
    set:
      persistence.metadata.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-audiobookshelf-config

  - it: should not create metadata PVC when using existing claim
    set:
      persistence.metadata.existingClaim: my-metadata
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-audiobookshelf-config

  - it: should apply claim-specific PVC labels and override common labels
    set:
      commonLabels:
        example.com/backup-policy: shared
      persistence.config.enabled: true
      persistence.config.extraLabels:
        example.com/backup-policy: config
        recurring-job.longhorn.io/source: "enabled"
      persistence.metadata.enabled: true
      persistence.metadata.extraLabels:
        example.com/backup-policy: metadata
        recurring-job.longhorn.io/source: "enabled"
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.labels["example.com/backup-policy"]
          value: config
        documentIndex: 0
      - equal:
          path: metadata.labels["recurring-job.longhorn.io/source"]
          value: "enabled"
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: audiobookshelf
        documentIndex: 0
      - equal:
          path: metadata.labels["example.com/backup-policy"]
          value: metadata
        documentIndex: 1
      - equal:
          path: metadata.labels["recurring-job.longhorn.io/source"]
          value: "enabled"
        documentIndex: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: audiobookshelf
        documentIndex: 1
