suite: test pvc
templates:
  - pvc.yaml
tests:
  # Config PVC tests
  - it: should create config pvc by default
    asserts:
      - containsDocument:
          kind: PersistentVolumeClaim
          apiVersion: v1
          name: RELEASE-NAME-qbittorrent-vpn-config

  - it: should not create config pvc when using existing claim
    set:
      qbittorrent.persistence.config.enabled: true
      qbittorrent.persistence.config.existingClaim: my-existing-pvc
    asserts:
      - hasDocuments:
          count: 0

  - it: should not create config pvc when disabled
    set:
      qbittorrent.persistence.config.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should use correct config pvc size
    set:
      qbittorrent.persistence.config.enabled: true
      qbittorrent.persistence.config.size: 5Gi
    asserts:
      - equal:
          path: spec.resources.requests.storage
          value: "5Gi"
        documentIndex: 0

  - it: should use config storage class
    set:
      qbittorrent.persistence.config.enabled: true
      qbittorrent.persistence.config.storageClass: fast-ssd
    asserts:
      - equal:
          path: spec.storageClassName
          value: "fast-ssd"
        documentIndex: 0

  - it: should disable config storage class when set to dash
    set:
      qbittorrent.persistence.config.enabled: true
      qbittorrent.persistence.config.storageClass: "-"
    asserts:
      - equal:
          path: spec.storageClassName
          value: ""
        documentIndex: 0

  - it: should apply config pvc annotations
    set:
      qbittorrent.persistence.config.enabled: true
      qbittorrent.persistence.config.annotations:
        backup.velero.io/backup-volumes: config
    asserts:
      - equal:
          path: metadata.annotations["backup.velero.io/backup-volumes"]
          value: "config"
        documentIndex: 0

  # Data PVC tests
  - it: should not create data pvc by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-qbittorrent-vpn-config

  - it: should create data pvc when enabled
    set:
      qbittorrent.persistence.config.enabled: false
      qbittorrent.persistence.data.enabled: true
    asserts:
      - containsDocument:
          kind: PersistentVolumeClaim
          apiVersion: v1
          name: RELEASE-NAME-qbittorrent-vpn-data

  - it: should not create data pvc when using existing claim
    set:
      qbittorrent.persistence.data.enabled: true
      qbittorrent.persistence.data.existingClaim: my-data-pvc
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-qbittorrent-vpn-config

  # Gluetun PVC tests
  - it: should not create gluetun pvc by default
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-qbittorrent-vpn-config

  - it: should create gluetun pvc when enabled
    set:
      qbittorrent.persistence.config.enabled: false
      gluetun.persistence.enabled: true
    asserts:
      - containsDocument:
          kind: PersistentVolumeClaim
          apiVersion: v1
          name: RELEASE-NAME-qbittorrent-vpn-gluetun

  - it: should not create gluetun pvc when using existing claim
    set:
      gluetun.persistence.enabled: true
      gluetun.persistence.existingClaim: my-gluetun-pvc
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-qbittorrent-vpn-config

  # Access modes tests
  - it: should use correct access modes
    set:
      qbittorrent.persistence.config.enabled: true
      qbittorrent.persistence.config.accessModes:
        - ReadWriteOnce
        - ReadOnlyMany
    asserts:
      - contains:
          path: spec.accessModes
          content: "ReadWriteOnce"
        documentIndex: 0
      - contains:
          path: spec.accessModes
          content: "ReadOnlyMany"
        documentIndex: 0

  - it: should apply claim-specific PVC labels and override common labels
    set:
      commonLabels:
        example.com/backup-policy: shared
      qbittorrent.persistence.config.enabled: true
      qbittorrent.persistence.config.extraLabels:
        example.com/backup-policy: config
        recurring-job.longhorn.io/source: "enabled"
      qbittorrent.persistence.data.enabled: true
      qbittorrent.persistence.data.extraLabels:
        example.com/backup-policy: data
        recurring-job.longhorn.io/source: "enabled"
      gluetun.persistence.enabled: true
      gluetun.persistence.extraLabels:
        example.com/backup-policy: gluetun
        recurring-job.longhorn.io/source: "enabled"
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.labels["example.com/backup-policy"]
          value: config
        documentIndex: 0
      - equal:
          path: metadata.labels["recurring-job.longhorn.io/source"]
          value: "enabled"
        documentIndex: 0
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: qbittorrent-vpn
        documentIndex: 0
      - equal:
          path: metadata.labels["example.com/backup-policy"]
          value: data
        documentIndex: 1
      - equal:
          path: metadata.labels["recurring-job.longhorn.io/source"]
          value: "enabled"
        documentIndex: 1
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: qbittorrent-vpn
        documentIndex: 1
      - equal:
          path: metadata.labels["example.com/backup-policy"]
          value: gluetun
        documentIndex: 2
      - equal:
          path: metadata.labels["recurring-job.longhorn.io/source"]
          value: "enabled"
        documentIndex: 2
      - equal:
          path: metadata.labels["app.kubernetes.io/name"]
          value: qbittorrent-vpn
        documentIndex: 2
